<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bank Transfer System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
    <h1>Bank Transfer System</h1>
</header>

<p style="padding: 10px 24px;">
    <a href="/deposit">Deposit</a> |
    <a href="/withdraw">Withdraw</a> |
    <a href="/large-transfers?min=10000">Large Transfers</a>
</p>

<div class="container">

    <div th:if="${successMessage}" class="msg success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="msg error" th:text="${errorMessage}"></div>

    <div class="stats">
        <div class="stat"><span>Customers</span><b th:text="${customerCount}">0</b></div>
        <div class="stat"><span>Total Balance (LKR)</span>
            <b th:text="${#numbers.formatDecimal(totalBalance, 1, 'COMMA', 2, 'POINT')}">0.00</b></div>
        <div class="stat"><span>Successful</span><b th:text="${successCount}">0</b></div>
        <div class="stat"><span>Failed</span><b th:text="${failedCount}">0</b></div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Transfer Money</h2>
            <form th:action="@{/transfer}" th:object="${transferRequest}" method="post">
                <label>From Account</label>
                <input type="text" th:field="*{fromAccount}">
                <div class="field-error" th:if="${#fields.hasErrors('fromAccount')}" th:errors="*{fromAccount}"></div>

                <label>To Account</label>
                <input type="text" th:field="*{toAccount}">
                <div class="field-error" th:if="${#fields.hasErrors('toAccount')}" th:errors="*{toAccount}"></div>

                <label>Amount (LKR)</label>
                <input type="number" step="0.01" th:field="*{amount}">
                <div class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>

                <label class="check">
                    <input type="checkbox" th:field="*{simulateFailure}">
                    Simulate a system failure
                </label>

                <button type="submit">Transfer</button>
            </form>
        </div>

        <div class="card">
            <h2>Add Customer</h2>
            <form th:action="@{/customers}" method="post">
                <label>Account Number</label>
                <input type="text" name="accountNumber" required>
                <label>Full Name</label>
                <input type="text" name="fullName" required>
                <label>Email</label>
                <input type="email" name="email" required>
                <label>Opening Balance (LKR)</label>
                <input type="number" step="0.01" min="0" name="balance" required>
                <button type="submit">Add Customer</button>
            </form>
        </div>
    </div>

    <div class="card">
        <h2>Customers</h2>
        <form th:action="@{/}" method="get" class="search">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name...">
            <button type="submit">Search</button>
        </form>
        <table>
            <thead>
            <tr><th>Account</th><th>Name</th><th>Email</th><th class="num">Balance (LKR)</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${customers}">
                <td th:text="${c.accountNumber}"></td>
                <td th:text="${c.fullName}"></td>
                <td th:text="${c.email}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(c.balance, 1, 'COMMA', 2, 'POINT')}"></td>
                <td><a th:href="@{/accounts/{acc}/history(acc=${c.accountNumber})}">View</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(customers)}"><td colspan="5">No customers found.</td></tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>Latest Transactions</h2>
        <table>
            <thead>
            <tr><th>ID</th><th>Time</th><th>From</th><th>To</th><th class="num">Amount</th><th>Status</th><th>Description</th></tr>
            </thead>
            <tbody>
            <tr th:each="t : ${transactions}">
                <td th:text="${t.id}"></td>
                <td th:text="${#temporals.format(t.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td th:text="${t.fromAccount}"></td>
                <td th:text="${t.toAccount}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(t.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                <td><span th:class="${t.status.name() == 'SUCCESS'} ? 'badge ok' : 'badge bad'" th:text="${t.status}"></span></td>
                <td th:text="${t.description}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(transactions)}"><td colspan="7">No transactions yet.</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
