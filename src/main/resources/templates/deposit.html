<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Deposit Money</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h2>Deposit Money</h2>
        <div th:if="${successMessage}" style="color: green;" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" style="color: red;" th:text="${errorMessage}"></div>
        
        <form action="/deposit" method="post">
            <label>Account Number:</label>
            <input type="text" name="accountNumber" required><br><br>
            
            <label>Amount to Deposit (LKR):</label>
            <input type="number" step="0.01" name="amount" required><br><br>
            
            <button type="submit">Deposit</button>
        </form>
        <br>
        <a href="/">Back to Dashboard</a>
    </div>
</body>
</html>
